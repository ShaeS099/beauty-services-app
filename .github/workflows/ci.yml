name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install backend (firebase-tools) deps
        working-directory: backend
        run: npm ci

      - name: Install functions deps
        working-directory: backend/functions
        run: npm ci

      - name: Typecheck functions (production build)
        working-directory: backend/functions
        run: npm run build

      - name: Typecheck functions (tests)
        working-directory: backend/functions
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Run backend tests against emulators
        working-directory: backend
        run: npx firebase emulators:exec --project demo-beautybooking --only auth,firestore "npm --prefix functions test"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npx expo lint --no-cache --max-warnings 0

      - name: Test
        working-directory: mobile
        run: npm test -- --ci
